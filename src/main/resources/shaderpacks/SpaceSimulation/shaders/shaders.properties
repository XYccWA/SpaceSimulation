# SpaceSimulation 内建光影包 —— 世界中心太阳的径向光照与阴影
#
# 太阳固定在世界原点 (0,0,0)，光向外辐射。本光影包配合模组的三个 mixin 工作：
#   CelestialUniformsMixin : 把 sunPosition 接管为径向方向（view space）
#   CommonUniformsMixin    : 注册 spaceSunDistance（相机到世界中心的距离，距离衰减用）
#   ShadowRendererMixin    : 把阴影视图矩阵接管为同一径向方向
#
# 太阳不是一个点光源：半径 5~10 万格。其角半径（选项 SUN_ANGULAR_SIN）同时决定
# 明暗交界的柔和程度与阴影半影宽度。

# 可调选项定义在 shaders/lib/space_settings.glsl（Iris 要求同名选项在各文件中一致）。
# 注意：距离衰减的两个参数（SUN_DISTANCE_FALLOFF / SUN_DISTANCE_REFERENCE）刻意做成
# 不带值列表的 const 而非选项 —— 见该文件中的说明。

# 显示为滑块的选项（其余选项以按钮形式循环取值）
sliders = SUN_INTENSITY SPACE_AMBIENT SUN_ANGULAR_SIN

# 设置界面分组
screen = [LIGHTING] [SHADOWS] *
screen.LIGHTING = SUN_INTENSITY SUN_FALLOFF_LEVEL SPACE_AMBIENT SUN_ANGULAR_SIN SPACE_AMBIENT_R SPACE_AMBIENT_G SPACE_AMBIENT_B
screen.SHADOWS = SHADOW_QUALITY shadowMapResolution shadowDistance
