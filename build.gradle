plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {

    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// 把根目录 GPL-3.0 许可证全文(TEMPLATE_LICENSE.txt)一并打进 jar
tasks.named('processResources') {
    from rootProject.file('TEMPLATE_LICENSE.txt')
}

repositories.clear()
repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven {
        name = "neoforgedReleases"
        url = uri("https://neoforged.forgecdn.net/releases")
    }
    maven {
        name = "neoforgedMojangMeta"
        url = uri("https://neoforged.forgecdn.net/mojang-meta")
    }
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name "caffeinemcRepositoryReleases"
        url "https://maven.caffeinemc.net/releases"
    }
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
    maven { url "https://maven.ryanhcode.dev/releases" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // 测试钩子：`./gradlew.bat runClient -PquickPlaySingleplayer=世界名` 直接载入单机存档。
//            if (project.hasProperty('quickPlaySingleplayer')) {
//                programArgument '--quickPlaySingleplayer'
//                programArgument project.quickPlaySingleplayer
//            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    localImplementation
    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "curse.maven:hitbox-api-1152734:5958930"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    localImplementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    localImplementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${create_aeronautics_version}")  { transitive false }
    localImplementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${create_aeronautics_version}")  { transitive false }
    localImplementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${create_aeronautics_version}")  { transitive false }

    runtimeOnly "maven.modrinth:c2me-neoforge:0.4.0-alpha.0.120+1.21.1"

    // CaffeineMC 官方 NeoForge 渲染依赖。Sodium 0.8 为拆包发布：
    //   sodium-neoforge-mod = 核心（mods.toml + mixin 配置 + 渲染引擎 + 全部 api 类）
    //   sodium-neoforge     = 外壳（compatibility/platform/desktop 类 + JarJar 内嵌核心）
    // dev/runClient 下 JarJar 不会展开内嵌核心，而核心的 mixin 会引用外壳中的
    // compatibility 类（如 Workarounds$Reference），故二者都必须在运行时类路径上。
    // 外壳与核心同 modId=sodium，作为 mod 会冲突，因此外壳只进类路径、不参与 mod 发现。
    // 另：Sable 2.0.5 声明 sodium < 0.8.12-alpha.2 为 incompatible，必须用 0.8.x。
    runtimeOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_version}"
    // transitive=false：外壳的 fabric-api 传递依赖运行时已由其它 mod 提供（版本亦不同），
    // 这里只需要外壳 jar 自身的 compatibility/platform 类。
    additionalRuntimeClasspath("net.caffeinemc:sodium-neoforge:${sodium_version}") { transitive = false }
    runtimeOnly "maven.modrinth:iris:${iris_version}"
    // Iris = 可选软依赖：内建光影包需要 mixin 接管 Iris 的太阳方向与阴影视图矩阵，
    // 因此编译期必须能看到 Iris 类；运行时由 MixinConfigPlugin 探测，未安装 Iris 时
    // 整个 space_simulation.iris.mixins.json 不应用，模组照常运行。
    compileOnly "maven.modrinth:iris:${iris_version}"
    // Sodium Config API（注册自己的视频设置页）：仅编译期引用接口，运行时类由核心提供。
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_version}"

    implementation "curse.maven:xaeros-minimap-263420:8046966"
    implementation "curse.maven:xaeros-world-map-317780:8042208"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    // 模板含中文注释/描述：expand 读写必须显式 UTF-8，否则 Windows 平台默认
    // GBK 会把 UTF-8 中文破坏成非法字节，生成的 neoforge.mods.toml 无法被 FML 解析。
    filteringCharset = 'UTF-8'
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
